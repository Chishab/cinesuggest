{% extends "base.html" %}
{% block title %}Login | CineSuggest{% endblock %}
{% block content %}
<div class="auth-panel mx-auto">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Log in</h1>
    <form method="post" novalidate>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" required data-testid="login-email">
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" required data-testid="login-password">
        </div>
        <button class="btn btn-primary w-100" type="submit" data-testid="login-button">Log in</button>
    </form>
    <p class="small mt-4 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
