{% extends "base.html" %}
{% block title %}Register | CineSuggest{% endblock %}
{% block content %}
<div class="auth-panel mx-auto">
    <p class="eyebrow">JOIN CINESUGGEST</p>
    <h1>Create account</h1>
    <form method="post" novalidate>
        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" type="text" required data-testid="register-username">
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" required data-testid="register-email">
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" minlength="8" required data-testid="register-password">
            <div class="form-text">Use at least 8 characters.</div>
        </div>
        <button class="btn btn-primary w-100" type="submit" data-testid="register-button">Create account</button>
    </form>
</div>
{% endblock %}
